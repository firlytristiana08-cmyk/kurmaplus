<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f4ede0" />
		<script>
			// Shim konstanta global SvelteKit: runtime klien membaca konstanta
			// __SVELTEKIT_* yang seharusnya ditetapkan oleh klien dev Vite lewat
			// __DEFINES__. Bila itu tidak aktif, referensi telanjang melempar
			// ReferenceError dan aplikasi tidak pernah terhidrasi. Shim ini hanya
			// mengisi yang belum ada — nilai sebenarnya (lewat klien dev) menang.
			(function () {
				var d = {
					__SVELTEKIT_DEV__: true,
					__SVELTEKIT_PATHS_BASE__: '',
					__SVELTEKIT_PATHS_ASSETS__: '',
					__SVELTEKIT_PATHS_RELATIVE__: true,
					__SVELTEKIT_PATHS_ORIGIN__: '',
					__SVELTEKIT_CLIENT_ROUTING__: true,
					__SVELTEKIT_HASH_ROUTING__: false,
					__SVELTEKIT_EMBEDDED__: false,
					__SVELTEKIT_FORK_PRELOADS__: false,
					__SVELTEKIT_SUPPORTS_ASYNC__: false,
					__SVELTEKIT_HAS_SERVER_LOAD__: true,
					__SVELTEKIT_HAS_UNIVERSAL_LOAD__: true,
					__SVELTEKIT_APP_DIR__: '_app',
					__SVELTEKIT_APP_VERSION__: '',
					__SVELTEKIT_APP_VERSION_FILE__: '_app/version.json',
					__SVELTEKIT_APP_VERSION_POLL_INTERVAL__: 0,
					__SVELTEKIT_APP_VERSION_CHECKS_ENABLED__: false,
					__SVELTEKIT_GLOBAL_NAME__: '__sveltekit_dev',
					__SVELTEKIT_CSRF_CHECK_ORIGIN__: false,
					__SVELTEKIT_LINK_HEADER_PRELOAD__: false,
					__SVELTEKIT_SERVICE_WORKER__: false,
					__SVELTEKIT_SERVER_TRACING_ENABLED__: false,
					__SVELTEKIT_TRACK__: function () {},
					__SVELTEKIT_PAYLOAD__: {}
				};
				for (var k in d) {
					if (typeof globalThis[k] === 'undefined') globalThis[k] = d[k];
				}
			})();
		</script>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon-192.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon-180.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// Diagnostik preview pengembangan: mencatat kegagalan pemuatan modul
			// dan keberhasilan hidrasi, lalu menampilkan ringkasannya di layar bila
			// ada masalah. Hanya aktif pada server dev (bootstrap @sveltejs/kit).
			(function () {
				var devBootstrap = false;
				for (var i = 0; i < document.scripts.length; i++) {
					var s = document.scripts[i];
					if (!s.src && s.textContent.indexOf('@sveltejs/kit') !== -1) {
						devBootstrap = true;
						break;
					}
				}
				if (!devBootstrap) return;
				var errs = [];
				window.addEventListener(
					'error',
					function (e) {
						var t = e.target;
						if (t && (t.src || t.href)) {
							errs.push('gagal memuat ' + (t.src || t.href));
						} else if (e.message) {
							errs.push(e.message + ' @' + (e.filename || '?') + ':' + (e.lineno || '?'));
						}
					},
					true
				);
				window.addEventListener('unhandledrejection', function (e) {
					var r = e.reason;
					errs.push('async: ' + String((r && r.message) || r));
				});
				setTimeout(function () {
					if (window.__kurmaHydrated && errs.length === 0) return;
					var d = document.createElement('div');
					d.setAttribute('role', 'status');
					d.style.cssText =
						'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#2D264B;color:#fff;font:12px/1.5 system-ui,sans-serif;padding:10px 12px';
					d.textContent =
						'Diagnostik preview — ' +
						(window.__kurmaHydrated
							? 'aplikasi jalan, tapi ada galat: ' + errs.slice(0, 2).join(' | ')
							: 'aplikasi TIDAK berhasil dimulai. ' +
								(errs.length
									? errs.slice(0, 3).join(' | ')
									: 'Tidak ada modul yang gagal tercatat — laporkan teks ini.'));
					document.body.appendChild(d);
				}, 5000);
			})();
		</script>
	</body>
</html>
