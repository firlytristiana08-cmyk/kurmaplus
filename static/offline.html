<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Offline — KURMAPLUS</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #f4ede0;
				color: #2d264b;
				font-family: system-ui, sans-serif;
				padding: 24px;
			}
			main {
				max-width: 430px;
				text-align: center;
			}
			h1 {
				font-size: 1.5rem;
				margin-bottom: 0.5rem;
			}
			p {
				line-height: 1.55;
			}
			a {
				display: inline-block;
				min-height: 48px;
				padding: 12px 24px;
				border-radius: 13px;
				background: #ab3710;
				color: #fffdf8;
				font-weight: 700;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Anda sedang offline</h1>
			<p>
				Katalog dan halaman informasi tetap bisa dibuka tanpa internet. Untuk checkout dan
				pembayaran, sambungkan kembali ke internet lalu muat ulang halaman ini.
			</p>
			<p><a href="/katalog">Coba buka katalog</a></p>
		</main>
	</body>
</html>
