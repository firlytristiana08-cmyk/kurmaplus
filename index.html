<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KURMAPLUS — Manisnya Sunnah, Berkahnya Ramadhan</title>
    <meta
      name="description"
      content="Toko kurma sukari, ajwa, dan tunisia. Pesan dari HP, dikirim Sabtu dan Minggu ke Jabodetabek lewat Grab atau Gojek."
    />
    <meta name="theme-color" content="#241710" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link
      rel="preload"
      href="images/hero.webp"
      as="image"
      type="image/webp"
      media="(max-width: 639px)"
    />
    <link
      rel="preload"
      href="images/bg-tablet.webp"
      as="image"
      type="image/webp"
      media="(min-width: 640px) and (max-width: 1023px)"
    />
    <link
      rel="preload"
      href="images/bg-desktop.webp"
      as="image"
      type="image/webp"
      media="(min-width: 1024px)"
    />
    <link rel="preload" href="fonts/figtree-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/figtree-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Versi pada URL CSS memaksa browser mengunduh ulang saat berubah:
        memory cache tidak menghormati Cache-Control (PRD: perubahan harus
        terlihat saat dijalankan). Naikkan angkanya setiap styles.css diubah. -->
    <link rel="stylesheet" href="styles.css?v=9" />
  </head>
  <body>
    <main class="page">
      <div class="canvas">
        <!-- Art direction: tiap perangkat hanya mengunduh satu gambar sesuai
            lebar layarnya (HP portrait, tablet, desktop lanskap) agar akses
            publik tetap ringan. -->
        <picture>
          <source media="(min-width: 1024px)" srcset="images/bg-desktop.webp" type="image/webp" />
          <source media="(min-width: 640px)" srcset="images/bg-tablet.webp" type="image/webp" />
          <img
            class="hero-bg"
            src="images/hero.webp"
            alt="Ilustrasi kampung Jakarta dengan Monas di kejauhan"
            width="539"
            height="956"
            fetchpriority="high"
          />
        </picture>
        <!-- Posisi kartu mengambang mengikuti mockup: kanan-atas di atas rumah
            yang menyala; lewat .card-anchor agar animasi masuk tidak
            bertabrakan dengan transform pemosisian. -->
        <div class="card-anchor">
          <section class="card" aria-labelledby="brand">
            <div class="card-body">
              <div class="brand-row">
                <img class="logo" src="images/logo-kurma.png" alt="" width="60" height="60" />
                <div class="brand-text">
                  <h1 class="wordmark" id="brand">KURMAPLUS</h1>
                  <p class="tagline">Manisnya Sunnah,<br />Berkahnya Ramadhan.</p>
                </div>
              </div>

              <!-- Mengarah ke katalog portal pelanggan yang dibangun setelah layar ini disetujui. -->
              <a class="btn" href="/">
                <!-- Ikon tas belanja filled: badan solid + gagang penuh,
                    warna mengikuti teks tombol (putih). -->
                <svg
                  class="btn-icon"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path d="M7.3 8.7v-.4a4.7 4.7 0 0 1 9.4 0v.4h-2.3v-.4a2.4 2.4 0 0 0-4.8 0v.4H7.3Z" />
                  <rect x="4.5" y="8" width="15" height="13.7" rx="2.7" />
                </svg>
                Beli Kurma
              </a>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Kegagalan pendaftaran diam-diam agar layar awal tetap terpakai di perangkat lama.
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
